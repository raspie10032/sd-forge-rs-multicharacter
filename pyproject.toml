[project]
name = "sd-forge-rs-multicharacter"
version = "0.1.0a5"
description = "Regional Anima prompts and character LoRAs for Forge Neo"
requires-python = ">=3.10"
license = "GPL-3.0-only"

[project.urls]
Repository = "https://github.com/raspie10032/sd-forge-rs-multicharacter"
Issues = "https://github.com/raspie10032/sd-forge-rs-multicharacter/issues"
Original = "https://github.com/raspie10032/ComfyUI_RS_MultiCharacter_Sampler"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py310"
line-length = 110
extend-exclude = ["rs_forge_mc/shared"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
