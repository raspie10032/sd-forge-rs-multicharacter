name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GRADIO_ANALYTICS_ENABLED: "False"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements-dev.txt
      - run: python tools/verify_sources.py
      - run: ruff check .
      - run: python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check javascript/rs_multicharacter.js
      - run: node --check javascript/rs_features.js
      - run: node --check rs_forge_mc/web/pose-adapter.js
      - run: python tools/build_windows_installer.py --check

  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/build_windows_installer.py --check
      - name: Test standalone installer with Windows PowerShell 5.1
        shell: powershell
        run: ./tools/test_windows_installer.ps1 -Online
